name: STONKS Quality Gate

on:
    push:
    pull_request:
        branches:
            - main

jobs:
    lint:
        name: Ruff
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.9"
                  cache: "pip"

            - name: Install dependencies
              run: python -m pip install -r requirements.txt

            - name: Run Ruff lint
              run: ruff check .

            - name: Verify Ruff formatting
              run: ruff format --check .

    test:
        name: Pytest
        runs-on: ubuntu-latest

        env:
            QT_QPA_PLATFORM: offscreen

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.9"
                  cache: "pip"

            - name: Install Qt system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0

            - name: Install dependencies
              run: python -m pip install -r requirements.txt

            - name: Run tests
              run: pytest -v --tb=short
